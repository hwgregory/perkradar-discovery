
name: PerkRadar public perk discovery

on:
  schedule:
    - cron: '21 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v

      - run: pip install playwright && python -m playwright install --with-deps chromium

      - run: python -m discovery.engine --out catalogue --render

      - name: Commit audited public catalogue
        run: |
          git config user.name 'perk-radar-bot'
          git config user.email 'perkradar-bot@users.noreply.github.com'
          git add catalogue/public-offers.json catalogue/coverage.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update public perk catalogue'
            git push
          fi
